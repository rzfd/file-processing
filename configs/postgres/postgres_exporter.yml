# Custom queries for Postgres Exporter
# This file can be used to define custom metrics queries

# Monitor file_metadata table statistics
file_metadata_stats:
  query: |
    SELECT 
      COUNT(*) as total_files,
      SUM(CASE WHEN status_code = 'pending' THEN 1 ELSE 0 END) as pending_files,
      SUM(CASE WHEN status_code = 'processing' THEN 1 ELSE 0 END) as processing_files,
      SUM(CASE WHEN status_code = 'completed' THEN 1 ELSE 0 END) as completed_files,
      SUM(CASE WHEN status_code = 'failed' THEN 1 ELSE 0 END) as failed_files,
      COALESCE(SUM(file_size), 0) as total_size_bytes
    FROM file_metadata;
  master: true
  metrics:
    - total_files:
        usage: "GAUGE"
        description: "Total number of files"
    - pending_files:
        usage: "GAUGE"
        description: "Number of pending files"
    - processing_files:
        usage: "GAUGE"
        description: "Number of files being processed"
    - completed_files:
        usage: "GAUGE"
        description: "Number of completed files"
    - failed_files:
        usage: "GAUGE"
        description: "Number of failed files"
    - total_size_bytes:
        usage: "GAUGE"
        description: "Total size of all files in bytes"

# Example: Monitor file processing by content type
file_processing_by_content_type:
  query: |
    SELECT 
      COALESCE(content_type, 'unknown') as content_type,
      COUNT(*) as count,
      AVG(EXTRACT(EPOCH FROM (processed_at - created_at))) as avg_processing_time_seconds
    FROM file_metadata
    WHERE processed_at IS NOT NULL
    GROUP BY content_type;
  master: true
  metrics:
    - content_type:
        usage: "LABEL"
        description: "Content type of file (text/csv, application/vnd.ms-excel, etc)"
    - count:
        usage: "GAUGE"
        description: "Number of files of this content type"
    - avg_processing_time_seconds:
        usage: "GAUGE"
        description: "Average processing time in seconds"

