[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# Input from Docker containers via forward protocol
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Parse JSON logs from Docker (nested JSON in 'log' field)
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    Reserve_Data On

# Add cluster and job labels
[FILTER]
    Name                modify
    Match               *
    Add                 cluster file-processing-system
    Add                 job fluentbit

# Map level field to detected_level for Grafana Loki
[FILTER]
    Name                modify
    Match               *
    Condition           Key_Exists level
    Copy                level detected_level

# Set default detected_level if not exists (for non-JSON logs)
[FILTER]
    Name                modify
    Match               *
    Condition           Key_Does_Not_Exist detected_level
    Add                 detected_level info

# Add service_name from container_name label
[FILTER]
    Name                modify
    Match               *
    Condition           Key_Value_Equals container_name backend
    Add                 service_name backend

[FILTER]
    Name                modify
    Match               *
    Condition           Key_Value_Equals container_name worker
    Add                 service_name worker

# Default service_name if not matched
[FILTER]
    Name                modify
    Match               *
    Condition           Key_Does_Not_Exist service_name
    Add                 service_name unknown

# Add HTTP method as label if exists
[FILTER]
    Name                modify
    Match               *
    Condition           Key_Exists method
    Copy                method http_method

# Output to Loki with enhanced labels
# Note: Only use low-cardinality fields as labels (job, service_name, detected_level)
# High-cardinality fields (request_id, trace_id, file_id, message) should stay in JSON content
[OUTPUT]
    Name                loki
    Match               *
    Host                loki
    Port                3100
    labels              job=fluentbit, service_name=$service_name, detected_level=$detected_level
    remove_keys         container_id,source
    line_format         json
    auto_kubernetes_labels off

