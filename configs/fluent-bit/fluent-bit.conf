[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# Input from Docker containers via forward protocol
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Parse JSON logs
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    Reserve_Data On
    Preserve_Key On

# Add container metadata and labels for Loki
[FILTER]
    Name                modify
    Match               *
    Add                 cluster file-processing-system
    Add                 job fluentbit

# Output to Loki
[OUTPUT]
    Name                loki
    Match               *
    Host                loki
    Port                3100
    labels              job=fluentbit
    remove_keys         container_id,source
    line_format         json
    auto_kubernetes_labels off

