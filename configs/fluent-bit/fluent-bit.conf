[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# Input from Docker containers via forward protocol
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Parse JSON logs from Docker (nested JSON in 'log' field)
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       json
    Reserve_Data On

# Add service_name label based on container metadata
[FILTER]
    Name                modify
    Match               *
    Add                 cluster file-processing-system
    Add                 job fluentbit

# Map level field to detected_level for Grafana Loki
[FILTER]
    Name                modify
    Match               *
    Condition           Key_Exists level
    Copy                level detected_level

# Add service_name from container_name if exists
[FILTER]
    Name                modify
    Match               *
    Condition           Key_Value_Equals container_name /file-processing-backend
    Add                 service_name backend

[FILTER]
    Name                modify
    Match               *
    Condition           Key_Value_Equals container_name /file-processing-worker
    Add                 service_name worker

# Output to Loki
[OUTPUT]
    Name                loki
    Match               *
    Host                loki
    Port                3100
    labels              job=fluentbit
    remove_keys         container_id,source
    line_format         json
    auto_kubernetes_labels off

